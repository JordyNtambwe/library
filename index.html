<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="styles.css">
  <title>Library</title>
</head>

<body>
  <h1>Library</h1>
  <button id="add-new-book">Add New Book</button>
  <div id="container"></div>
    <dialog id="book-dialog">
      <h2>New Book</h2>
      <form class="book-form" >
        <div class="title">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div class="author">
          <label for="author">Author:</label>
          <input type="text" id="author" name="author" required>
        </div>
        <div class="pages">
          <label for="pages">How Many Pages?:</label>
          <input type="number" id="pages" name="pages" required>
        </div>
        <div class="read-or-not-read">
          <label for="read-or-not-read">Have You Read This Book?:</label>
          <input type="checkbox" id="read-or-not-read" name="read-or-not-read">
        </div>
        <div class="submit">
          <button type="submit" id="submit" name="submit">Add Book</button>
        </div>
      </form>
    </dialog>
</body>

</html>
